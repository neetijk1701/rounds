<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Hard block on all network access: nothing typed here can be sent anywhere. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-title" content="Rounds">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Rounds</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1b2430;--mute:#667085;--line:#d9dee6;--acc:#1f3a5f;--acc2:#2f6fb3;--ok:#1e8e5a;--warn:#b54708;--bad:#c0392b;--warnbg:#fff4e5}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#18202b;--ink:#e6ebf2;--mute:#98a2b3;--line:#2b3644;--acc:#9cc3ff;--acc2:#6aa6f0;--ok:#4cc38a;--warn:#f5a524;--bad:#ff6b6b;--warnbg:#2b2112}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px}
@media (prefers-color-scheme:dark){header{background:#132235}}
.hrow{display:flex;gap:6px;align-items:center}
.hrow h1{font-size:17px;margin:0;flex:1}
.pill{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:999px;padding:4px 9px;font-size:12px;white-space:nowrap}
.pill.bad{background:#b54708}
.qr{background:#fff;padding:10px;border-radius:10px;display:flex;justify-content:center;margin:8px 0}
.qr svg{width:220px;height:220px}
.code{font:600 17px ui-monospace,Menlo,monospace;letter-spacing:.06em;text-align:center;user-select:all;margin:6px 0}
.hbtn{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.tab{flex:none;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.tab.on{background:#fff;color:#1f3a5f;font-weight:600}
.tab small{opacity:.75;margin-left:4px}
.tab.all{font-weight:700}
main{max-width:900px;margin:0 auto;padding:10px 10px 90px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
summary{list-style:none;padding:11px 12px;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--acc);display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"▸";margin-left:auto;transition:transform .15s;color:var(--mute)}
details[open]>summary::after{transform:rotate(90deg)}
summary .cnt{font-weight:600;text-transform:none;letter-spacing:0;color:var(--mute);font-size:12px}
.body{padding:0 12px 12px}
.grid{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:640px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:1fr 1fr 1fr}}
label.f{display:block}
label.f>span{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:0 0 3px}
input[type=text],input[type=date],input[type=password],input[type=number],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 9px}
textarea{resize:none;min-height:38px;overflow:hidden;display:block}
input:focus,textarea:focus{outline:2px solid var(--acc2);outline-offset:-1px;border-color:transparent}
.f>span .mv{float:right;background:none;border:1px solid var(--line);color:var(--acc2);border-radius:6px;padding:0 7px;font-size:12px;font-weight:600;line-height:18px}
.f>span .dt{font-style:normal;font-weight:500;color:var(--warn)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));background:#1b2430;color:#fff;padding:10px 14px;border-radius:10px;z-index:30;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:92vw}
#toast button{background:none;border:0;color:#9cc3ff;font-weight:700;margin-left:8px}
.old{color:var(--mute)!important;background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(127,127,127,.07) 6px 12px)!important;font-style:italic}
.oldbar{background:rgba(127,127,127,.12);color:var(--mute);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:8px}
.oldbar button{background:none;border:0;color:var(--acc2);font-weight:700;padding:0 0 0 4px;font-size:13px}
.mini.keep{color:var(--ok);border-color:var(--ok)}
.warnbar{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 10px;font-weight:600;font-size:13px;margin-bottom:8px}
.chk{display:flex;align-items:flex-start;gap:9px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:14px}
.chk:last-child{border-bottom:0}
.chk input[type=checkbox]{width:20px;height:20px;flex:none;margin:0;accent-color:var(--ok)}
.chk.done>.lbl{color:var(--mute);text-decoration:line-through}
.chk .lbl{flex:1}
.tri{display:flex;align-items:center;gap:9px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:14px;width:100%;background:none;border-left:0;border-right:0;border-top:0;color:var(--ink);text-align:left}
.tri .dot{width:22px;height:22px;flex:none;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px}
.tri[data-s="1"] .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.tri[data-s="2"] .dot{background:var(--bad);border-color:var(--bad);color:#fff}
.tri[data-s="2"]{font-weight:600}
.legend{font-size:12px;color:var(--mute);margin:0 0 6px}
.inline{display:inline-flex;align-items:center;gap:4px}
.inline input{width:56px;padding:3px 6px;font-size:15px}
.inline input.w{width:110px}
.cols{columns:1}
@media(min-width:640px){.cols{columns:2;column-gap:18px}.cols>*{break-inside:avoid}}
.vrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.vrow input[type=text]{flex:1}
.x{background:none;border:0;color:var(--mute);font-size:18px;padding:4px 8px}
.add{background:none;border:1px dashed var(--line);color:var(--acc2);border-radius:8px;padding:7px 10px;width:100%;margin-top:4px;font-weight:600}
.prob{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
.prob .ph{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.prob .num{font-weight:800;color:var(--acc);width:22px}
.prob .ph input{flex:1;font-weight:600}
.mini{background:none;border:1px solid var(--line);border-radius:6px;color:var(--mute);padding:3px 8px;font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px}
.btn.pri{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.meta{font-size:12px;color:var(--mute);margin:4px 2px}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
/* overlays */
.ov{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
.ov .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:380px;width:100%}
.ov h2{margin:0 0 6px;font-size:20px}
.ov p{color:var(--mute);font-size:14px;margin:6px 0 12px}
.ov .btn{width:100%;margin-top:8px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 8px}
.sheet .btn{width:100%;margin-top:8px;text-align:left}
.sheet .note{font-size:12px;color:var(--mute);margin:8px 0 0}
.hidden{display:none!important}
/* lab boxes */
.fishes{display:flex;flex-wrap:wrap;gap:10px;margin:2px 0 10px}
.fb{border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;align-items:stretch}
.fbh{font-size:12px;font-weight:600;color:var(--mute);margin:0 0 4px;width:100%}
.fwrap{display:flex;flex-direction:column}
.lc{display:flex;flex-direction:column;align-items:center;padding:3px 5px;min-width:62px}
.lc .ln{font-size:11px;font-weight:700;color:var(--mute)}
.lc input{width:58px!important;text-align:center;padding:4px 2px!important;font-size:16px}
.lc .trw,.lc .tr{font-size:11px;color:var(--mute);min-height:15px;white-space:nowrap}
.lc.hi input,.lc.hi b{color:var(--bad);font-weight:700}
.lc.lo input,.lc.lo b{color:var(--acc2);font-weight:700}
.bmp .g{display:grid;grid-template-columns:repeat(3,auto)}
.bmp .g .lc:nth-child(-n+3){border-bottom:2px solid var(--line)}
.bmp .g .lc:not(:nth-child(3n)){border-right:2px solid var(--line)}
.bmp .glu{display:flex;align-items:center;border-left:2px solid var(--line);margin-left:2px;padding-left:2px}
.cbc{align-items:center}
.cbc .mid{display:flex;flex-direction:column;border-left:2px solid var(--line);border-right:2px solid var(--line);margin:0 2px}
.cbc .mid .lc:first-child{border-bottom:2px solid var(--line)}
.xtra{gap:0}
.xtra .lc:not(:last-child){border-right:2px solid var(--line)}
/* to-dos */
.vrow.todo.done input[type=text]{text-decoration:line-through;color:var(--mute)}
/* present view */
.pres{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:18px;line-height:1.5}
.pres .ph1{font-size:22px;font-weight:800;margin:0 0 2px}
.pres .ph2{color:var(--mute);font-size:15px;margin-bottom:6px}
.ps{display:grid;grid-template-columns:1fr;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
@media(min-width:700px){.ps{grid-template-columns:130px 1fr;gap:14px}}
.ps h4{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);padding-top:5px}
.ps p{margin:0 0 4px}
.ps ul{margin:2px 0 4px;padding-left:20px}
.oldtxt{color:var(--mute);font-style:italic}
.stale{display:inline-block;font-size:12px;font-style:normal;font-weight:700;color:var(--warn);background:var(--warnbg);border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.pp{margin:0 0 10px}
.pp .plan{margin-left:14px}
.abn{color:var(--bad)}
.pnav{display:flex;gap:8px;margin-top:12px}
.pnav .btn{flex:1}
.pres .fb{font-size:15px}
/* census */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.card .ch{display:flex;gap:8px;align-items:baseline;width:100%;background:none;border:0;padding:0;color:var(--ink);text-align:left;font-size:16px}
.card .ch .nm{flex:1}
.card .pct{color:var(--mute);font-size:12px}
.card .ol{margin:4px 0;font-size:15px}
.bdg{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;margin:2px 4px 2px 0;background:var(--warnbg);color:var(--warn)}
.bdg.cs{background:rgba(127,127,127,.14);color:var(--mute)}
.card .chk{padding:5px 2px}
.sumline{color:var(--mute);font-size:14px;margin:4px 2px}
@media print{
  header,.toolbar,.add,.x,.mini,.sheet,.ov,.noprint{display:none!important}
  body{background:#fff;color:#000;font-size:11px}
  main{padding:0;max-width:none}
  details{border:1px solid #999;break-inside:avoid;margin:6px 0}
  details:not([open])>.body{display:block}
  input,textarea{border:0;border-bottom:1px solid #ccc;border-radius:0;padding:2px;font-size:11px}
  .tri,.chk{padding:2px;font-size:11px}
}
</style>
</head>
<body>

<header class="noprint">
  <div class="hrow">
    <h1 id="title">Rounds</h1>
    <button class="pill hidden" id="syncPill" data-act="syncSheet"></button>
    <button class="hbtn hidden" id="presBtn" data-act="present">▶ Present</button>
    <button class="hbtn" data-act="addPt">＋ Patient</button>
    <button class="hbtn" data-act="menu" aria-label="Menu">☰</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main id="main"></main>

<!-- First run / lock screens -->
<div class="ov hidden" id="ovSetup"><div class="box">
  <h2>Rounds</h2>
  <p>Everything you type stays in this browser on this device. The page cannot make network requests.</p>
  <p>Set a passcode to encrypt what's saved here (recommended). There is no recovery if you forget it.</p>
  <input type="password" id="setP1" placeholder="Passcode" autocomplete="new-password">
  <input type="password" id="setP2" placeholder="Confirm passcode" autocomplete="new-password" style="margin-top:8px">
  <div class="err" id="setErr"></div>
  <button class="btn pri" id="setGo">Set passcode</button>
  <button class="btn" id="setSkip">Continue without a passcode</button>
</div></div>

<div class="ov hidden" id="ovLock"><div class="box">
  <h2>🔒 Locked</h2>
  <p>Enter your passcode to unlock.</p>
  <input type="password" id="lockP" placeholder="Passcode" autocomplete="current-password">
  <div class="err" id="lockErr"></div>
  <button class="btn pri" id="lockGo">Unlock</button>
  <button class="btn danger" id="lockWipe">Forgot it — erase everything</button>
</div></div>

<div class="sheet hidden" id="menu"><div class="box">
  <h3>Menu</h3>
  <button class="btn" data-act="syncSheet">🔄 Sync devices</button>
  <button class="btn" data-act="newDayAll">☀️ New day — all patients</button>
  <button class="btn" data-act="print">🖨 Print this patient</button>
  <button class="btn" data-act="lockNow" id="mLock">🔒 Lock now</button>
  <button class="btn" data-act="passcode" id="mPass">Set passcode</button>
  <button class="btn danger" data-act="wipe">Erase all data on this device only</button>
  <button class="btn" data-act="closeMenu">Close</button>
  <p class="note" id="storeNote"></p>
</div></div>

<div id="toast" class="hidden noprint"></div>
<div class="sheet hidden" id="syncSheet"><div class="box" id="syncBox"></div></div>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

function apBanner(p){
  const any=p.onelinerOld||p.problems.some(pr=>pr.old&&Object.keys(pr.old).length);
  if(!any)return"";
  return `<div class="oldbar">Gray = carried over from ${esc(mmdd(p.apFrom)||"yesterday")}. Edit a field to make it current, or tap ✓ if it's unchanged. <button data-act="apKeepAll">Mark all current</button></div>`;
}
function unGray(k,el){
  const p=P();el.classList.remove("old");
  if(k==="oneliner"){p.onelinerOld=false;markTs("onelinerOld")}
  else if(k==="today.exam"){p.examOld=false;markTs("examOld")}
  else if(k==="examNotes"){p.examNotesOld=false;markTs("examNotesOld")}
  else{const m=k.match(/^problems\.(\d+)\.(\w+)$/);if(m){const pr=p.problems[+m[1]];if(pr&&pr.old){delete pr.old[m[2]];markTs("problems")}}}
  const b=$("main").querySelector(".oldbar");if(b&&!$("main").querySelector(".old"))b.remove();
  const i=k.match(/^problems\.(\d+)\./);if(i&&!Object.keys(p.problems[+i[1]].old||{}).length){const kb=$("main").querySelector(`[data-act="apKeep"][data-i="${i[1]}"]`);if(kb)kb.remove()}
}
function rollover(p){
  // A&P carries forward, grayed out until you touch it
  if((p.oneliner||"").trim())p.onelinerOld=true;
  p.problems.forEach(pr=>{pr.old={};["p","a","pl"].forEach(fl=>{if((pr[fl]||"").trim())pr.old[fl]=1})});
  p.apFrom=p.today.date||today();
  p.priorExam={notes:p.examNotes||"",date:p.today.date||today()};
  p.todos=(p.todos||[]).filter(x=>x.t.trim()&&!x.done);
  p.examOld=false;p.examNotesOld=false;
  const t=p.today;moveValues(p,VALUES.map(([k])=>k),false);
  p.today=Object.assign({date:today(),lab:{},verify:t.verify.filter(v=>v.t.trim()).map(v=>({t:v.t,done:false}))},blankVals());
  if(!p.today.verify.length)p.today.verify.push({t:"",done:false});
  p.medsChk={};p.examChk={};p.apChk={};p.examNotes="";p.updated=Date.now();p.epoch=Date.now();p.ts={};
}
async function passcodeFlow(){

    const choice=prompt("Type a NEW passcode to change it, or leave blank and press OK to REMOVE the passcode (data will be stored unencrypted).");
    if(choice===null)return;
    if(choice===""){if(S.sync){alert("Turn off sync first (Sync devices → Turn off on this device). Sync requires a passcode.");return}if(confirm("Remove passcode? Saved data will no longer be encrypted.")){key=null;salt=null;await saveNow();render()}return}
    if(choice.length<4){alert("Use at least 4 characters.");return}
    if(prompt("Confirm new passcode")!==choice){alert("Didn't match — passcode unchanged.");return}
    salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(choice,salt);await saveNow();render();alert("Passcode changed.");
  }else{
    const a=prompt("New passcode (at least 4 characters). No recovery if forgotten.");if(a===null)return;
    if(a.length<4){alert("Use at least 4 characters.");return}
    if(prompt("Confirm passcode")!==a){alert("Didn't match.");return}
    salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(a,salt);await saveNow();render();resetIdle();alert("Passcode set. Data is now encrypted on this device.");
  }
}

/* ================= END-TO-END ENCRYPTED SYNC =================
   The pairing code (120 random bits) never leaves your devices except inside the QR / typed code.
   From it we derive (a) the AES-GCM key that encrypts everything before upload and
   (b) a vault id (a hash) that tells the server where to keep the scrambled blob.
   The server never gets the code or the key, so it cannot read anything. */
const B32="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
function toB32(bytes){let bits=0,val=0,out="";for(const b of bytes){val=(val<<8)|b;bits+=8;while(bits>=5){out+=B32[(val>>>(bits-5))&31];bits-=5}}if(bits>0)out+=B32[(val<<(5-bits))&31];return out}
function fromB32(s){let bits=0,val=0;const out=[];for(const ch of s){const i=B32.indexOf(ch);if(i<0)return null;val=(val<<5)|i;bits+=5;if(bits>=8){out.push((val>>>(bits-8))&255);bits-=8}}return new Uint8Array(out)}
function normCode(s){return String(s||"").toUpperCase().replace(/0/g,"O").replace(/1/g,"I").replace(/8/g,"B").replace(/[^A-Z2-7]/g,"")}
const fmtCode=c=>c.match(/.{1,4}/g).join("-");
const hex=buf=>[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
let syncKey=null, vaultId=null, syncBusy=false, syncAgain=false, pollT=null, pushT=null, syncStatus="off", lastSyncAt=0;

async function syncInit(){
  if(!S||!S.sync||!key||!hasCrypto()){syncKey=null;setSync("off");return}
  const raw=fromB32(S.sync.secret);
  const base=await crypto.subtle.importKey("raw",raw,"HKDF",false,["deriveKey","deriveBits"]);
  syncKey=await crypto.subtle.deriveKey({name:"HKDF",hash:"SHA-256",salt:te.encode("rounds-sync-v1"),info:te.encode("encrypt")},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  vaultId=hex(await crypto.subtle.deriveBits({name:"HKDF",hash:"SHA-256",salt:te.encode("rounds-sync-v1"),info:te.encode("vault-id")},base,256));
  try{ls().setItem(LS_VAULT,vaultId)}catch(e){}
  clearInterval(pollT);pollT=setInterval(()=>{if(!document.hidden)sync()},POLL_S*1000);
  await sync();
}
function syncStop(){clearInterval(pollT);clearTimeout(pushT);pollT=null;syncKey=null;setSync("off")}
function schedulePush(){if(!syncKey)return;clearTimeout(pushT);pushT=setTimeout(sync,1500)}
function setSync(st){
  syncStatus=st;const el=$("syncPill");
  el.classList.toggle("hidden",st==="off");el.classList.toggle("bad",st==="offline");
  el.textContent=st==="busy"?"⟳ Syncing":st==="offline"?"⚠ Offline":st==="ok"?"✓ Synced":"";
  if(!$("syncSheet").classList.contains("hidden"))renderSyncBox();
}
async function encBlob(str){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},syncKey,te.encode(str));return b64(iv)+"."+b64(ct)}
async function decBlob(blob){const [iv,ct]=blob.split(".");return td.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(iv)},syncKey,unb64(ct)))}
const payload=()=>JSON.stringify({patients:S.patients,deleted:S.deleted||{}});

/* per-patient merge: newest edit wins; deletions are remembered for 30 days */
function merge(local,remote){
  const cutoff=Date.now()-30*864e5, deleted={};
  for(const src of [remote.deleted||{},local.deleted||{}])for(const [id,t] of Object.entries(src))if(t>cutoff&&!(deleted[id]>=t))deleted[id]=t;
  const L=new Map(local.patients.map(p=>[p.id,p])), R=new Map(remote.patients.map(p=>[p.id,p]));
  const order=[...remote.patients.map(p=>p.id),...local.patients.map(p=>p.id).filter(id=>!R.has(id))];
  const patients=[];
  for(const id of order){
    const l=L.get(id),r=R.get(id);
    const pick=!l?r:!r?l:mergePatient(l,r);
    if(deleted[id]&&deleted[id]>=(pick.updated||0))continue;
    patients.push(pick);
  }
  return {patients,deleted};
}
const clone=o=>o===undefined?undefined:JSON.parse(JSON.stringify(o));
function mergePatient(l,r){
  // Same patient on both sides. A "new day" (epoch) on one side wins over the older day;
  // otherwise start from the more recently edited copy and pull in any field edited more recently on the other.
  let base,other;
  if((l.epoch||0)!==(r.epoch||0)){[base,other]=(l.epoch||0)>(r.epoch||0)?[l,r]:[r,l]}
  else{[base,other]=(l.updated||0)>(r.updated||0)?[l,r]:[r,l]}
  const out=clone(base);out.ts=out.ts||{};
  for(const [f,t] of Object.entries(other.ts||{})){
    if(t>(out.ts[f]||0)&&t>(out.epoch||0)){const v=getPath(other,f);try{setPath(out,f,clone(v));out.ts[f]=t}catch(e){}}
  }
  out.updated=Math.max(l.updated||0,r.updated||0);
  return out;
}
async function sync(){
  if(!syncKey||!S)return;
  if(syncBusy){syncAgain=true;return}
  syncBusy=true;if(syncStatus!=="ok"||S.sync.dirty)setSync("busy");
  const vid=vaultId;
  try{
    for(let attempt=0;attempt<5;attempt++){
      const r=await fetch(`/api/v/${vid}?since=${S.sync.rev}`,{cache:"no-store"});
      if(r.status===410){remoteWiped();return}
      if(!r.ok)throw new Error("HTTP "+r.status);
      const d=await r.json();
      if(!S||vid!==vaultId)return;          // locked or unpaired meanwhile
      let needPush=!!S.sync.dirty;
      if(!d.same){
        if(d.blob){
          const remote=JSON.parse(await decBlob(d.blob));
          const before=payload(), merged=merge({patients:S.patients,deleted:S.deleted},remote);
          S.patients=merged.patients;S.deleted=merged.deleted;
          if(!S.patients.some(p=>p.id===cur))cur=S.patients[0]?.id||null;
          if(payload()!==before)softRender();
          needPush=JSON.stringify(merged)!==JSON.stringify({patients:remote.patients,deleted:remote.deleted||{}});
        }else needPush=S.patients.length>0||needPush;
        S.sync.rev=d.rev;
      }
      if(!needPush){S.sync.dirty=false;break}
      const snap=payload();
      const pr=await fetch(`/api/v/${vid}`,{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({baseRev:S.sync.rev,blob:await encBlob(snap)})});
      if(pr.status===409)continue;            // someone else saved first: pull, merge, retry
      if(pr.status===410){remoteWiped();return}
      if(!pr.ok)throw new Error("HTTP "+pr.status);
      S.sync.rev=(await pr.json()).rev;
      if(payload()===snap)S.sync.dirty=false;
      break;
    }
    lastSyncAt=Date.now();setSync("ok");saveNow();
  }catch(e){setSync("offline")}
  finally{syncBusy=false;if(syncAgain){syncAgain=false;setTimeout(sync,200)}}
}
function softRender(){
  const a=document.activeElement,k=a&&a.dataset?a.dataset.k:null;let ss=null,se=null;
  if(k){try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}}
  const y=scrollY;render();scrollTo(0,y);
  if(k){const n=$("main").querySelector(`[data-k="${k}"]`);if(n){n.focus({preventScroll:true});try{if(ss!=null)n.setSelectionRange(ss,se)}catch(e){}}}
}
function remoteWiped(){
  const L=ls();if(L){L.removeItem(LS_ENC);L.removeItem(LS_PLAIN);L.removeItem(LS_VAULT)}
  S=null;key=null;syncStop();
  alert("Your synced rounds data was erased from another device, so this device's copy has been erased too.");
  location.reload();
}
/* a locked device still checks for a remote erase (the vault id reveals nothing) */
async function remoteWipeCheck(){
  const L=ls(),vid=L&&L.getItem(LS_VAULT);if(!vid)return;
  try{const r=await fetch(`/api/v/${vid}?check=1`,{cache:"no-store"});if(r.status===410)remoteWiped()}catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&syncKey)sync()});
window.addEventListener("online",()=>{if(syncKey)sync()});

async function ensurePasscode(){
  if(key)return true;
  if(!hasCrypto()){alert("Sync needs encryption, which this browser context doesn't support.");return false}
  alert("Sync needs a passcode on this device first, so the sync key is stored encrypted.");
  await passcodeFlow();return !!key;
}
async function startSync(){
  if(!(await ensurePasscode()))return;
  S.sync={secret:toB32(crypto.getRandomValues(new Uint8Array(15))),rev:0,dirty:true};
  await saveNow();await syncInit();renderSyncBox();
}
async function joinSync(code){
  const c=normCode(code);
  if(c.length!==24||!fromB32(c)){alert("That code doesn't look right — it should be 24 letters/numbers.");return false}
  if(!(await ensurePasscode()))return false;
  S.sync={secret:c,rev:0,dirty:S.patients.length>0};
  await saveNow();await syncInit();renderSyncBox();return true;
}
async function handlePendingPair(){
  if(!pendingPair||!S)return;const c=normCode(pendingPair);pendingPair=null;
  if(S.sync&&S.sync.secret===c){openSync();return}
  if(!confirm(S.sync?"Switch this device to the new sync link? (It will stop syncing with the old one.)":"Link this device to your other device for sync?"))return;
  if(S.sync)syncStop();
  if(await joinSync(c))openSync();
}
function openSync(){renderSyncBox();show("syncSheet")}
function renderSyncBox(){
  const box=$("syncBox");if(!S){box.innerHTML="";return}
  let h=`<h3>🔄 Sync devices</h3>`;
  if(!S.sync){
    h+=`<p class="note" style="margin:0 0 8px">End-to-end encrypted: notes are locked on this device before upload, and only your paired devices hold the key. The server stores scrambled data it can't read, and deletes it after 30 days without use.</p>
    <button class="btn pri" data-sync="start">Turn on sync (first device)</button>
    <p class="note">Already turned on elsewhere? Scan its QR code, or type its code here:</p>
    <input type="text" id="joinCode" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX" autocapitalize="characters" autocomplete="off" spellcheck="false">
    <button class="btn" data-sync="join">Link this device</button>`;
  }else{
    const code=fmtCode(S.sync.secret), url=location.origin+"/#pair="+code;
    let svg="";try{const q=qrcode(0,"M");q.addData(url);q.make();svg=q.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(e){}
    const when=lastSyncAt?new Date(lastSyncAt).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}):"—";
    h+=`<p class="note" style="margin:0">Status: <b>${syncStatus==="ok"?"Synced":syncStatus==="busy"?"Syncing…":syncStatus==="offline"?"Offline — will sync when back online":"Off"}</b> · last ${when}</p>
    <p class="note">To add your other device: scan this with its camera, or type the code into its Sync screen. Anyone with this code can read your synced notes — don't share it.</p>
    <details style="margin:6px 0"><summary>Show pairing QR &amp; code</summary><div class="body"><div class="qr">${svg}</div><div class="code">${esc(code)}</div></div></details>
    <button class="btn" data-sync="now">Sync now</button>
    <button class="btn" data-sync="off">Turn off sync on this device</button>
    <button class="btn danger" data-sync="erase">Erase synced data everywhere</button>`;
  }
  h+=`<button class="btn" data-sync="close">Close</button>`;
  box.innerHTML=h;
}
$("syncSheet").addEventListener("click",async e=>{
  if(e.target.id==="syncSheet"){hide("syncSheet");return}
  const b=e.target.closest("[data-sync]");if(!b)return;const a=b.dataset.sync;
  if(a==="close")hide("syncSheet");
  else if(a==="start")startSync();
  else if(a==="join")joinSync($("joinCode").value);
  else if(a==="now")sync();
  else if(a==="off"){if(confirm("Stop syncing on this device? Notes already here stay here.")){syncStop();S.sync=null;try{ls().removeItem(LS_VAULT)}catch(e){}await saveNow();renderSyncBox()}}
  else if(a==="erase"){
    if(!confirm("Erase the synced copy AND the notes on every paired device (each erases itself next time it opens or syncs)?")||!confirm("This can't be undone. Erase everywhere?"))return;
    try{const r=await fetch(`/api/v/${vaultId}`,{method:"DELETE"});if(!r.ok&&r.status!==410)throw 0}catch(err){alert("Couldn't reach the sync server — nothing was erased. Try again when online.");return}
    wipe();
  }
});

if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("/sw.js").catch(()=>{})})}
boot();
</script>
